# ICR-RL setting, Acrobot (not in the notebook -> ICR-RL paper App. B): training reward = tip height
# -cos t1 - cos(t1 + t2) (App. B.2), the same SB3 DQN. Evaluation in original reward (-500 = never swung up).
env: {id: Acrobot-v1, reward: icr_rl}
train: {total_steps: 150000, eval_every: 1500}
student: {hidden: [64, 64], lr: 0.0005, batch_size: 64, buffer_size: 150000, learning_starts: 100,
          target_update: 500, eps_start: 0.95, eps_end: 0.1, eps_decay_steps: 15000}
