# LunarLander (original reward; not in ICR-RL): DQN hyperparameters of SB3 rl-baselines3-zoo (dqn.yml, LunarLander,
# tuned for 1e5 steps): lr 6.3e-4, [256, 256], batch 128, buffer 50k, learning_starts 0, target update 250,
# train_freq 4 with gradient_steps -1 (4 updates every 4 steps), epsilon 1.0 -> 0.1 over 12% of the budget.
# gymnasium 1.x ships LunarLander-v3 (v2 was removed). Target return 200 (solved).
env: {id: LunarLander-v3, reward: original, target_return: 200}
train: {total_steps: 100000, eval_every: 1000}
student: {hidden: [256, 256], lr: 0.00063, batch_size: 128, buffer_size: 50000, learning_starts: 0,
          train_freq: 4, gradient_steps: -1, target_update: 250, eps_start: 1.0, eps_end: 0.1, eps_decay_steps: 12000}
